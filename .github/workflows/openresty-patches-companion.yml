name: Openresty patches review companion
on:
  pull_request:
    paths:
    - 'build/openresty/patches/**'

permissions:
  contents: write
  pull-requests: write
  issues: write # for sending comments

jobs:
  create-pr:
    if: ${{ github.repository_owner == 'Kong' }}
    uses: Kong/openresty-patches-review/.github/workflows/create-pr.yml@master
    with:
      pr-branch: ${{ github.event.pull_request.head.repo.owner.login }}:${{ github.head_ref }}
      pr-base: ${{ github.base_ref }}
      ee: ${{ contains(github.repository, 'kong-ee') }}
      pr-id: ${{ github.event.pull_request.number }}
    secrets: inherit
